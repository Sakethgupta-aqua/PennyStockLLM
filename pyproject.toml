[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pennystock"
version = "0.1.0"
description = "Accountable research copilot for Indian small/micro-cap equities (paper-only)."
requires-python = ">=3.10"
dependencies = [
  "pydantic-settings",
  "rapidfuzz",
  "langchain-core",
  "langchain-community",
  "langchain-chroma",
  "langchain-huggingface",
  "langchain-ollama",
  "langchain-text-splitters",
  "langgraph",
  "bm25s",
  "chromadb",
  "yfinance",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["pennystock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
